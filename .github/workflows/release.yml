name: Release build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality checks
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate project versions
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cargo = Get-Content src-tauri/Cargo.toml -Raw

          $cargoVersionMatch = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $cargoVersionMatch.Success) {
            throw '无法从 src-tauri/Cargo.toml 读取版本号'
          }

          $versions = @(
            $package.version
            $tauri.version
            $cargoVersionMatch.Groups[1].Value
          ) | Select-Object -Unique

          if ($versions.Count -ne 1) {
            throw "版本号不一致：package.json=$($package.version)，tauri.conf.json=$($tauri.version)，Cargo.toml=$($cargoVersionMatch.Groups[1].Value)"
          }

          Write-Host "项目版本：$($package.version)"

      - name: Validate release tag
        if: github.event_name == 'push'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "标签 $($env:RELEASE_TAG) 与项目版本 $($package.version) 不一致，应使用 $expectedTag"
          }

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Build Rust test binaries
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-run

      - name: Add Windows test manifest
        shell: pwsh
        run: |
          $manifest = @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <dependency>
              <dependentAssembly>
                <assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls" version="6.0.0.0" processorArchitecture="*" publicKeyToken="6595b64144ccf1df" language="*" />
              </dependentAssembly>
            </dependency>
          </assembly>
          '@

          $testBinaries = @(Get-ChildItem -Path src-tauri/target/debug/deps -Filter 'lilt_lib-*.exe' -File)
          if ($testBinaries.Count -eq 0) {
            throw '未找到 Rust 测试二进制'
          }

          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          foreach ($testBinary in $testBinaries) {
            [System.IO.File]::WriteAllText("$($testBinary.FullName).manifest", $manifest, $utf8NoBom)
          }

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: Build Windows ${{ matrix.arch }}
    needs: quality
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate updater signing secret
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw '缺少 TAURI_SIGNING_PRIVATE_KEY Secret，无法生成 updater 签名产物'
          }

      - name: Build NSIS installer
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tauriScript: npm run tauri
          args: --target ${{ matrix.rust_target }} --bundles nsis
          includeUpdaterJson: false

      - name: Stage installer
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $bundlePath = Join-Path "src-tauri/target/$env:RUST_TARGET/release/bundle/nsis" '*-setup.exe'
          $installers = @(Get-ChildItem -Path $bundlePath -File)

          if ($installers.Count -ne 1) {
            throw "NSIS 安装包数量异常：$($installers.Count)，搜索路径为 $bundlePath"
          }

          $signaturePath = "$($installers[0].FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath -PathType Leaf)) {
            throw "未找到 NSIS updater 签名：$signaturePath"
          }

          $stagingPath = 'release-staging'
          New-Item -ItemType Directory -Path $stagingPath -Force | Out-Null
          $destination = Join-Path $stagingPath "Lilt_$($package.version)_windows_$env:ARCH`_setup.exe"
          Copy-Item -LiteralPath $installers[0].FullName -Destination $destination
          Copy-Item -LiteralPath $signaturePath -Destination "$destination.sig"
          Write-Host "已暂存安装包：$destination"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: lilt-windows-${{ matrix.arch }}-release-assets
          path: release-staging/*
          if-no-files-found: error
          retention-days: 7

  publish-draft:
    name: Create Draft Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download installer artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: lilt-windows-*-release-assets
          merge-multiple: true
          path: release-assets

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t installers < <(find release-assets -maxdepth 1 -type f -name '*.exe' -print)
          mapfile -t signatures < <(find release-assets -maxdepth 1 -type f -name '*.sig' -print)
          if [[ "${#installers[@]}" -ne 1 ]]; then
            echo "期望一个 Windows x64 安装包，实际找到 ${#installers[@]} 个"
            printf '%s\n' "${installers[@]}"
            exit 1
          fi
          if [[ "${#signatures[@]}" -ne 1 ]]; then
            echo "期望一个 updater 签名文件，实际找到 ${#signatures[@]} 个"
            printf '%s\n' "${signatures[@]}"
            exit 1
          fi
          installer="${installers[0]}"
          signature="${signatures[0]}"
          [[ "$installer" == *windows_amd64_setup.exe ]]
          [[ "$signature" == "$installer.sig" ]]
          [[ -s "$signature" ]]
      - name: Create or reuse Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if release_draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$release_draft" != 'true' ]]; then
              echo "标签 $RELEASE_TAG 已对应正式 Release，停止修改已发布内容"
              exit 1
            fi
            echo "复用已有 Draft Release：$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "Lilt $RELEASE_TAG" \
              --draft \
              --generate-notes \
              --notes 'Windows 安装包暂未进行代码签名，首次安装时可能出现 SmartScreen 提示。Updater 签名用于应用内更新包校验。'
          fi

      - name: Generate updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          setup_name="Lilt_${version}_windows_amd64_setup.exe"
          setup_path="release-assets/$setup_name"
          signature_path="$setup_path.sig"
          if [[ ! -f "$setup_path" || ! -s "$signature_path" ]]; then
            echo "缺少 updater 安装包或签名：$setup_path"
            exit 1
          fi

          signature="$(<"$signature_path")"
          notes="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""')"
          pub_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${setup_name}"
          jq -n \
            --arg version "$version" \
            --arg notes "$notes" \
            --arg pub_date "$pub_date" \
            --arg url "$url" \
            --arg signature "$signature" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"windows-x86_64": {url: $url, signature: $signature}}}' \
            > release-assets/latest.json

          jq -e \
            --arg version "$version" \
            --arg url "$url" \
            '.version == $version and .platforms["windows-x86_64"].url == $url and (.platforms["windows-x86_64"].signature | length > 0)' \
            release-assets/latest.json > /dev/null
          rm -- "$signature_path"

          mapfile -t final_assets < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          expected_setup="$setup_name"
          if [[ "${#final_assets[@]}" -ne 2 ]] \
            || ! printf '%s\n' "${final_assets[@]}" | grep -Fxq 'latest.json' \
            || ! printf '%s\n' "${final_assets[@]}" | grep -Fxq "$expected_setup"; then
            echo '最终 Release 资产必须只包含 setup.exe 与 latest.json'
            printf '%s\n' "${final_assets[@]}"
            exit 1
          fi

      - name: Remove stale draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          setup_name="Lilt_${version}_windows_amd64_setup.exe"
          while IFS= read -r asset_name; do
            [[ -z "$asset_name" || "$asset_name" == "$setup_name" || "$asset_name" == 'latest.json' ]] && continue
            gh release delete-asset "$RELEASE_TAG" "$asset_name" --repo "$GITHUB_REPOSITORY" --yes
          done < <(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
